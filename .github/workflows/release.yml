name: Release

# v1.2.3 のようなタグをpushすると、テストのあとでポータブル版とインストーラーをビルドし、
# SHA-256とビルド証明（どのソースからGitHub上でビルドしたかの記録）を付けてReleaseへ公開する。
# Actions画面から手動実行した場合は、Releaseを作らずにArtifactとして取得できる。

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  release:
    runs-on: windows-latest
    permissions:
      contents: write # Releaseの作成
      id-token: write # ビルド証明の署名
      attestations: write # ビルド証明の保存
    steps:
      # 外部のActionはタグではなくコミットで固定し、後から中身を差し替えられないようにする
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - name: Cache Rust build
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: src-tauri

      - name: Read and check version
        id: version
        shell: pwsh
        run: |
          $package = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $tauri = (Get-Content src-tauri/tauri.conf.json -Raw | ConvertFrom-Json).version
          $cargo = (Select-String -Path src-tauri/Cargo.toml -Pattern '^version = "(.+)"').Matches[0].Groups[1].Value
          if ($package -ne $tauri -or $package -ne $cargo) {
            throw "バージョンが一致しません: package.json=$package tauri.conf.json=$tauri Cargo.toml=$cargo"
          }
          if ($env:GITHUB_REF_TYPE -eq "tag" -and $env:GITHUB_REF_NAME -ne "v$package") {
            throw "タグ $env:GITHUB_REF_NAME とアプリのバージョン v$package が一致しません"
          }
          Add-Content -Path $env:GITHUB_OUTPUT -Value "version=$package" -Encoding utf8

      - name: Install frontend dependencies
        run: npm ci

      - name: Type check
        run: npx tsc --noEmit -p .

      - name: Rust tests
        working-directory: src-tauri
        run: cargo test --lib --locked

      - name: Build application and installer
        run: npm run tauri build -- --bundles nsis

      - name: Package release files
        shell: pwsh
        run: |
          $version = "${{ steps.version.outputs.version }}"
          $out = New-Item -ItemType Directory -Force -Path release
          $portable = New-Item -ItemType Directory -Force -Path "staging/IrodoriStudio"
          Copy-Item src-tauri/target/release/IrodoriStudio.exe $portable
          Copy-Item README.md, LICENSE, PORTABLE_START.txt, THIRD_PARTY_NOTICES.txt, VOICE_CLONING_NOTICE.txt $portable
          Copy-Item licenses -Destination $portable -Recurse
          Compress-Archive -Path "staging/IrodoriStudio" -DestinationPath "release/IrodoriStudio-$version-windows-x64-portable.zip"
          $installer = Get-ChildItem src-tauri/target/release/bundle/nsis -Filter "*-setup.exe" | Select-Object -First 1
          if (-not $installer) { throw "インストーラーが見つかりません" }
          Copy-Item $installer.FullName "release/IrodoriStudio-$version-windows-x64-setup.exe"
          # zipから取り出したexe単体でも確認できるよう、exeのハッシュも記載する
          Copy-Item src-tauri/target/release/IrodoriStudio.exe "staging/IrodoriStudio.exe"
          $files = @(Get-ChildItem release -File) + @(Get-Item "staging/IrodoriStudio.exe")
          $files | ForEach-Object {
            "$((Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower())  $($_.Name)"
          } | Set-Content -Encoding utf8 release/SHA256SUMS.txt
          Get-Content release/SHA256SUMS.txt

      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            release/*.zip
            release/*.exe
            staging/IrodoriStudio.exe

      - name: Upload artifact
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: IrodoriStudio-${{ steps.version.outputs.version }}-windows-x64
          path: release/*
          if-no-files-found: error

      - name: Create GitHub Release
        if: github.ref_type == 'tag'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = "${{ steps.version.outputs.version }}"
          $sums = (Get-Content release/SHA256SUMS.txt -Raw).TrimEnd()
          $notes = @"
          ## ダウンロード

          - **ポータブル版**: ``IrodoriStudio-$version-windows-x64-portable.zip``（展開したフォルダを削除すればアンインストール完了）
          - **インストーラー版**: ``IrodoriStudio-$version-windows-x64-setup.exe``

          初回起動時に必要なソフトウェアとモデル（合計で約7〜11GB）を各配布元からダウンロードします。
          詳しくはREADMEの「安心して使っていただくために」をご覧ください。

          ## ダウンロードしたファイルの確認

          これらのファイルは、このリポジトリのタグ ``$env:GITHUB_REF_NAME`` のソースから、GitHub Actions上でビルドしたものです。

          **SHA-256**（PowerShellで ``Get-FileHash ファイル名`` を実行して比較できます）

          ``````
          $sums
          ``````

          **ビルド証明**（GitHub CLIで、このリポジトリのGitHub Actionsでビルドされたことを確認できます）

          ``````
          gh attestation verify ファイル名 --repo $env:GITHUB_REPOSITORY
          ``````
          "@
          Set-Content -Encoding utf8 release-notes.md $notes
          gh release create $env:GITHUB_REF_NAME release/* --title "IrodoriStudio $version" --notes-file release-notes.md --verify-tag
